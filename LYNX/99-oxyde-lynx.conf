# /etc/sysctl.d/99-oxyde-lynx.conf
# Oxyde Lynx Kernel • Universal desktop tunings
# Safe, reversible defaults that improve interactivity and keep RAM use low.
# Apply with: sudo sysctl --system

########################
# Memory / VM
########################
vm.swappiness = 15                  # prefer RAM; swap only under pressure
vm.vfs_cache_pressure = 50          # retain inode/dentry cache a bit longer
vm.dirty_background_ratio = 5       # start background writeback earlier
vm.dirty_ratio = 15                 # cap dirty page cache to avoid stalls
vm.max_map_count = 262144           # headroom for games/browsers/containers

########################
# Networking
########################
net.core.default_qdisc = fq_codel   # low-latency queueing by default
net.ipv4.tcp_congestion_control = bbr
net.ipv4.tcp_fastopen = 3           # enable TFO for client+server sockets

# Optional (uncomment if you want larger TCP buffers for high-bandwidth links)
# net.core.rmem_max = 2500000
# net.core.wmem_max = 2500000
# net.ipv4.tcp_rmem = 4096 131072 2097152
# net.ipv4.tcp_wmem = 4096 131072 2097152

########################
# Filesystem notifications (helps large codebases/IDEs)
########################
fs.inotify.max_user_watches = 1048576
fs.inotify.max_user_instances = 1024

########################
# Kernel logging (keep dmesg sane on laptops)
########################
kernel.printk = 4 4 1 7
